name: Deploy Quartz to GitHub Pages

on:
  schedule:
    # 每6小时自动运行一次，确保网站内容更新
    - cron: '0 */6 * * *'
  push:
    # 当有更改推送到网站的 main 分支时也触发
    branches:
      - main
  workflow_dispatch: # 允许在网页上手动触发工作流

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Site Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 获取所有历史记录，这对 Quartz 很有用

      - name: Checkout Content Repo
        uses: actions/checkout@v5
        with:
          repository: 12kkkk/obsidian_git_for_website # ！！！修改这里 ！！！
          token: ${{ secrets.ACCESS_TOKEN }}
          path: content # 将内容仓库克隆到 'content' 文件夹

      - name: Clean up content directory
        run: | # 清理不必要的文件，避免构建错误
          rm -rf content/.git
          rm -rf content/.obsidian
          find content -name ".DS_Store" -delete

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
